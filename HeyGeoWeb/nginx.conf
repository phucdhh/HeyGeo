events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;

    server {
        listen 80;
        server_name heygeo.pedu.vn;

        # Redirect HTTP → HTTPS (Cloudflare handles TLS, but keep just in case)
        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl http2;
        server_name heygeo.pedu.vn;

        # ──────────────────────────────────────────────
        # TLS – replace with your actual cert paths
        # If behind Cloudflare Full (Strict), use an Origin Certificate
        # ──────────────────────────────────────────────
        ssl_certificate     /etc/ssl/heygeo/cert.pem;
        ssl_certificate_key /etc/ssl/heygeo/key.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        # Security headers
        add_header X-Frame-Options        "SAMEORIGIN"  always;
        add_header X-Content-Type-Options "nosniff"     always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
        add_header X-XSS-Protection       "1; mode=block" always;

        client_max_body_size 10M;

        # Download endpoint – larger timeout for big zip files
        location /api/download/ {
            limit_req zone=api burst=10 nodelay;
            proxy_pass             http://app:3000;
            proxy_http_version     1.1;
            proxy_set_header       Host $host;
            proxy_set_header       X-Real-IP $remote_addr;
            proxy_set_header       X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header       X-Forwarded-Proto $scheme;
            proxy_read_timeout     600s;   # 10 min cho file lớn
            proxy_send_timeout     600s;
            proxy_buffering        off;    # Stream trực tiếp, không buffer
        }

        # API rate limiting
        location /api/ {
            limit_req zone=api burst=40 nodelay;
            proxy_pass         http://app:3000;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection 'upgrade';
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }

        # Next.js app
        location / {
            proxy_pass         http://app:3000;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection 'upgrade';
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }

        # Static asset caching
        location /_next/static/ {
            proxy_pass http://app:3000;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
    }
}
